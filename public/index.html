<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIGHT TRACE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101318;color:#eee;font-family:system-ui,"Yu Gothic",sans-serif}main{max-width:760px;margin:auto;padding:24px}h1{text-align:center;letter-spacing:.2em;margin:5px 0 8px}.sub{text-align:center;color:#aab3bf}.panel{background:#181e27;border:1px solid #374151;border-radius:14px;padding:16px;margin:16px 0}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:560px;margin:18px auto}.building{aspect-ratio:1;background:#29323d;border:2px solid #596575;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;font-size:28px}.building:hover{border-color:#fff}.building.selected{border-color:#f0d84a;box-shadow:inset 0 0 0 4px #f0d84a}.num{position:absolute;top:5px;left:7px;font-size:11px;color:#9ba5b2}.center{text-align:center}.status{font-weight:700;margin:12px}.button{border:0;border-radius:9px;background:#3b4c66;color:#fff;padding:11px 22px;font-weight:700;font-size:16px;cursor:pointer}.button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<main>
<h1>NIGHT TRACE</h1>
<div class="sub">試作版：犯人の初期位置を選択</div>
<section class="panel">
<div class="center">5×5の建物から犯人の初期位置を直接クリック</div>
<div id="map" class="map"></div>
<div id="status" class="status center">初期位置：未選択</div>
<div class="center"><button id="start" class="button" disabled>ゲーム開始</button></div>
</section>
</main>
<script>
const map=document.getElementById('map');
const status=document.getElementById('status');
const start=document.getElementById('start');
let selected=null;
for(let r=0;r<5;r++)for(let c=0;c<5;c++){
 const cell=document.createElement('div');cell.className='building';
 cell.innerHTML='<span class="num">'+(r*5+c+1)+'</span>';
 cell.addEventListener('click',()=>{
  document.querySelectorAll('.building').forEach(x=>{x.classList.remove('selected');const m=x.querySelector('.mark');if(m)m.remove()});
  selected={r,c};cell.classList.add('selected');
  const mark=document.createElement('span');mark.className='mark';mark.textContent='🟡';cell.appendChild(mark);
  status.textContent='初期位置：建物'+(r*5+c+1)+'（'+(r+1)+'行'+(c+1)+'列）';start.disabled=false;
 });
 map.appendChild(cell);
}
start.addEventListener('click',()=>{if(!selected)return;status.textContent='初期位置：建物'+(selected.r*5+selected.c+1)+'　選択完了';start.textContent='選択済み';start.disabled=true;});
</script>
</body>
</html>
