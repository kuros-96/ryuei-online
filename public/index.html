<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NUMBER CROSS</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<main>

  <!-- NUMBER CROSS ロゴ -->
  <header class="game-logo">

    <div class="logo-number">
      NUMBER
    </div>

    <div class="logo-cross">
      CROSS
    </div>

    <div class="logo-sub">
      ONLINE BATTLE
    </div>

    <div class="number-orbit">
      <span>1</span>
      <span>2</span>
      <span>3</span>
      <span>4</span>
      <span>5</span>
      <span>6</span>
      <span>7</span>
      <span>8</span>
      <span>9</span>
    </div>

  </header>

  <section id="lobby" class="panel">

    <input
      id="name"
      maxlength="16"
      placeholder="プレイヤー名"
    >

    <div class="row">
      <button id="create">ルームを作る</button>
    </div>

    <div class="join">

      <input
        id="room"
        maxlength="6"
        placeholder="ルームコード"
      >

      <button id="join">
        参加する
      </button>

    </div>

    <p id="status">
      ルームを作成するか、コードを入力して参加してください。
    </p>

  </section>

  <section id="game" class="panel hidden">

    <div class="top">

      <span>
        ROOM <b id="roomId">---</b>
      </span>

      <span>
        R<span id="round">1</span>/9
      </span>

      <span id="scores">
        0 - 0
      </span>

    </div>

    <div class="arena">

      <div>

        <h2 id="p1name">
          PLAYER 1
        </h2>

        <div id="p1card" class="card hidden">
          ？
        </div>

        <div id="p1state">
          待機中
        </div>

      </div>

      <div>

        <h2 id="p2name">
          PLAYER 2
        </h2>

        <div id="p2card" class="card hidden">
          ？
        </div>

        <div id="p2state">
          待機中
        </div>

      </div>

    </div>

    <div id="message" class="message">
      相手を待っています…
    </div>

   <div id="remaining" class="remaining">
  残り数字：9枚
</div>

<div id="buttons" class="buttons"></div>

    <p class="rule">
      通常は大きい数字が勝ち。1は9に勝つ。
      同じ数字は禁止・使用済み数字は再使用不可。
    </p>

    <button id="back">
      ロビーへ戻る
    </button>

  </section>

</main>

<div id="battleOverlay" class="battle-overlay">
  <div id="battleText"></div>
</div>

<script src="app.js"></script>

</body>
</html>
